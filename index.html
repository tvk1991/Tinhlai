<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tính Toán Lãi Suất Ngân Hàng Việt Nam</title>
    <!-- Cấu hình PWA & Apple Touch Icon cho iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lãi Suất Bank">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f172a%22/><text y=%22.9em%22 font-size=%2280%22 x=%2210%22>🏦</text></svg>">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        /* Hiệu ứng viền LED RGB 7 màu chạy quanh khung */
        @keyframes rgbBorder {
            0% { border-color: #ff0000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
            14% { border-color: #ff7f00; box-shadow: 0 0 20px rgba(255, 127, 0, 0.4); }
            28% { border-color: #ffff00; box-shadow: 0 0 20px rgba(255, 255, 0, 0.4); }
            42% { border-color: #00ff00; box-shadow: 0 0 20px rgba(0, 255, 0, 0.4); }
            57% { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); }
            71% { border-color: #0000ff; box-shadow: 0 0 20px rgba(0, 0, 255, 0.4); }
            85% { border-color: #8b00ff; box-shadow: 0 0 20px rgba(139, 0, 255, 0.4); }
            100% { border-color: #ff0000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border-radius: 24px;
            border: 3px solid #ff0000;
            animation: rgbBorder 6s infinite linear;
            padding: 20px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 900;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }

        .section-title {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            color: #fbbf24;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 14px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #38bdf8;
        }

        /* Danh sách Logo Ngân Hàng chuẩn SVG */
        .bank-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .bank-scroll::-webkit-scrollbar {
            display: none;
        }

        .bank-card {
            min-width: 76px;
            height: 64px;
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px;
        }

        .bank-card.active {
            border-color: #38bdf8;
            background: #0369a1;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .bank-card svg {
            width: 28px;
            height: 28px;
            margin-bottom: 3px;
        }

        .bank-card span {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: #f1f5f9;
        }

        /* Tabs chuyển đổi Tiết kiệm / Vay */
        .mode-tabs {
            display: flex;
            background: #1f2937;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-tab.active {
            background: #2563eb;
            color: #ffffff;
        }

        /* Nút tính toán chính */
        .btn-calc {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            margin-bottom: 16px;
        }

        /* Kết quả hiển thị */
        .result-box {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 16px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px dashed #374151;
        }

        .result-label {
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .result-value {
            font-weight: 900;
            color: #38bdf8;
            font-size: 15px;
        }

        .result-value.highlight {
            color: #4ade80;
            font-size: 17px;
        }

        .schedule-title {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            color: #fbbf24;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        .schedule-table-container {
            max-height: 140px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #374151;
            font-size: 11px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid #374151;
        }

        th {
            background: #111827;
            color: #94a3b8;
            font-weight: 800;
            text-transform: uppercase;
            position: sticky;
            top: 0;
        }

        td {
            color: #e2e8f0;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>BỘ TÍNH TOÁN LÃI SUẤT NGÂN HÀNG</h1>
        <p>Cập nhật biểu lãi suất mới nhất Việt Nam</p>
    </header>

    <!-- Chọn Ngân Hàng (Logo Vector SVG Chuẩn Màu) -->
    <div class="section-title">Chọn Ngân Hàng</div>
    <div class="bank-scroll" id="bankList">
        <!-- Được tạo tự động bằng JS -->
    </div>

    <!-- Chế độ: Tiết kiệm / Vay -->
    <div class="mode-tabs">
        <div class="mode-tab active" onclick="switchMode('saving')" id="tabSaving">Gửi Tiết Kiệm</div>
        <div class="mode-tab" onclick="switchMode('loan')" id="tabLoan">Vay Vốn</div>
    </div>

    <!-- Khung nhập liệu -->
    <div class="input-group">
        <label id="lblAmount">Số Tiền Gửi (VNĐ)</label>
        <input type="text" id="txtAmount" value="100.000.000" oninput="formatCurrency(this)">
    </div>

    <div class="input-group">
        <label>Kỳ Hạn</label>
        <select id="selTerm" onchange="updateRate()">
            <option value="1">1 Tháng</option>
            <option value="3">3 Tháng</option>
            <option value="6">6 Tháng</option>
            <option value="12" selected>12 Tháng</option>
            <option value="24">24 Tháng</option>
        </select>
    </div>

    <div class="input-group" id="groupInterestType">
        <label>Hình Thức Nhận Lãi</label>
        <select id="selInterestType">
            <option value="maturity">Cuối Kỳ</option>
            <option value="monthly">Hàng Tháng</option>
            <option value="quarterly">Hàng Quý</option>
        </select>
    </div>

    <div class="input-group">
        <label>Lãi Suất (%/Năm) - Có thể sửa tay</label>
        <input type="number" id="txtRate" value="6.0" step="0.1">
    </div>

    <button class="btn-calc" onclick="calculate()">TÍNH TOÁN NGAY</button>

    <!-- Kết quả -->
    <div class="result-box" id="resultContainer">
        <div class="result-row">
            <span class="result-label">Lãi Suất Áp Dụng:</span>
            <span class="result-value" id="resRate">6.0% / năm</span>
        </div>
        <div class="result-row">
            <span class="result-label" id="lblResMain">Tổng Tiền Lãi Dự Kiến:</span>
            <span class="result-value highlight" id="resInterest">6.000.000 VNĐ</span>
        </div>
        <div class="result-row">
            <span class="result-label" id="lblResSub">Tổng Gốc + Lãi:</span>
            <span class="result-value" id="resTotal">106.000.000 VNĐ</span>
        </div>
        
        <div id="scheduleSection" style="display:none;">
            <div class="schedule-title">Lịch Trả Nợ Chi Tiết Hàng Tháng</div>
            <div class="schedule-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Tháng</th>
                            <th>Gốc Phải Trả</th>
                            <th>Lãi Phải Trả</th>
                            <th>Tổng Gốc+Lãi</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const banks = [
        { id: 'vcb', name: 'VCB', fullName: 'Vietcombank', color: '#006241', rateSaving: 4.7, rateLoan: 7.5, svg: '<circle cx="16" cy="16" r="14" fill="#006241"/><text x="16" y="21" font-size="11" fill="white" font-weight="bold" text-anchor="middle">VCB</text>' },
        { id: 'bidv', name: 'BIDV', fullName: 'BIDV', color: '#005596', rateSaving: 4.8, rateLoan: 7.6, svg: '<circle cx="16" cy="16" r="14" fill="#005596"/><text x="16" y="21" font-size="10" fill="white" font-weight="bold" text-anchor="middle">BIDV</text>' },
        { id: 'agri', name: 'AGRI', fullName: 'Agribank', color: '#0072bc', rateSaving: 4.8, rateLoan: 7.5, svg: '<circle cx="16" cy="16" r="14" fill="#0072bc"/><text x="16" y="21" font-size="9" fill="white" font-weight="bold" text-anchor="middle">AGRI</text>' },
        { id: 'vpb', name: 'VPB', fullName: 'VPBank', color: '#009a49', rateSaving: 5.3, rateLoan: 8.2, svg: '<circle cx="16" cy="16" r="14" fill="#009a49"/><text x="16" y="21" font-size="10" fill="white" font-weight="bold" text-anchor="middle">VPB</text>' },
        { id: 'hdb', name: 'HDB', fullName: 'HDBank', color: '#f37021', rateSaving: 5.2, rateLoan: 8.0, svg: '<circle cx="16" cy="16" r="14" fill="#f37021"/><text x="16" y="21" font-size="10" fill="white" font-weight="bold" text-anchor="middle">HDB</text>' },
        { id: 'acb', name: 'ACB', fullName: 'ACB', color: '#003781', rateSaving: 5.0, rateLoan: 7.8, svg: '<circle cx="16" cy="16" r="14" fill="#003781"/><text x="16" y="21" font-size="11" fill="white" font-weight="bold" text-anchor="middle">ACB</text>' },
        { id: 'vib', name: 'VIB', fullName: 'VIB', color: '#00539f', rateSaving: 5.4, rateLoan: 8.3, svg: '<circle cx="16" cy="16" r="14" fill="#00539f"/><text x="16" y="21" font-size="11" fill="white" font-weight="bold" text-anchor="middle">VIB</text>' },
        { id: 'sacom', name: 'SACOM', fullName: 'Sacombank', color: '#00483a', rateSaving: 5.1, rateLoan: 8.1, svg: '<circle cx="16" cy="16" r="14" fill="#00483a"/><text x="16" y="20" font-size="7.5" fill="white" font-weight="bold" text-anchor="middle">SACOM</text>' },
        { id: 'lp', name: 'LPB', fullName: 'LPBank', color: '#d32f2f', rateSaving: 5.5, rateLoan: 8.5, svg: '<circle cx="16" cy="16" r="14" fill="#d32f2f"/><text x="16" y="21" font-size="10" fill="white" font-weight="bold" text-anchor="middle">LPB</text>' },
        { id: 'pv', name: 'PVB', fullName: 'PVcomBank', color: '#ed1c24', rateSaving: 5.8, rateLoan: 8.6, svg: '<circle cx="16" cy="16" r="14" fill="#ed1c24"/><text x="16" y="21" font-size="10" fill="white" font-weight="bold" text-anchor="middle">PVB</text>' },
        { id: 'bv', name: 'BVB', fullName: 'BVBank', color: '#008559', rateSaving: 5.6, rateLoan: 8.4, svg: '<circle cx="16" cy="16" r="14" fill="#008559"/><text x="16" y="21" font-size="10" fill="white" font-weight="bold" text-anchor="middle">BVB</text>' },
        { id: 'citi', name: 'CITI', fullName: 'Citibank', color: '#003b70', rateSaving: 4.5, rateLoan: 7.2, svg: '<circle cx="16" cy="16" r="14" fill="#003b70"/><text x="16" y="21" font-size="9" fill="white" font-weight="bold" text-anchor="middle">CITI</text>' }
    ];

    let currentMode = 'saving';
    let selectedBankId = 'vpb';

    function renderBanks() {
        const container = document.getElementById('bankList');
        container.innerHTML = banks.map(b => `
            <div class="bank-card ${b.id === selectedBankId ? 'active' : ''}" onclick="selectBank('${b.id}')">
                <svg viewBox="0 0 32 32">${b.svg}</svg>
                <span>${b.name}</span>
            </div>
        `).join('');
    }

    function selectBank(id) {
        selectedBankId = id;
        renderBanks();
        updateRate();
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('tabSaving').classList.toggle('active', mode === 'saving');
        document.getElementById('tabLoan').classList.toggle('active', mode === 'loan');
        
        document.getElementById('lblAmount').innerText = mode === 'saving' ? 'Số Tiền Gửi (VNĐ)' : 'Số Tiền Vay (VNĐ)';
        document.getElementById('groupInterestType').style.display = mode === 'saving' ? 'block' : 'none';
        document.getElementById('txtAmount.value') // fix syntax
        
        updateRate();
        calculate();
    }

    function updateRate() {
        const bank = banks.find(b => b.id === selectedBankId);
        const term = parseInt(document.getElementById('selTerm').value);
        let baseRate = currentMode === 'saving' ? bank.rateSaving : bank.rateLoan;
        
        if (term >= 12) baseRate += 0.3;
        else if (term >= 6) baseRate += 0.1;

        document.getElementById('txtRate').value = baseRate.toFixed(1);
    }

    function formatCurrency(input) {
        let value = input.value.replace(/\D/g, '');
        if (value === '') { input.value = ''; return; }
        input.value = Number(value).toLocaleString('vi-VN');
    }

    function getRawNumber(id) {
        return parseFloat(document.getElementById(id).value.replace(/\./g, '').replace(/,/g, '')) || 0;
    }

    function formatMoney(num) {
        return Math.round(num).toLocaleString('vi-VN') + ' VNĐ';
    }

    function calculate() {
        const principal = getRawNumber('txtAmount');
        const termMonths = parseInt(document.getElementById('selTerm').value);
        const annualRate = parseFloat(document.getElementById('txtRate').value) / 100;
        const scheduleSection = document.getElementById('scheduleSection');
        const scheduleBody = document.getElementById('scheduleBody');

        if (currentMode === 'saving') {
            scheduleSection.style.display = 'none';
            document.getElementById('lblResMain').innerText = 'Tổng Tiền Lãi Dự Kiến:';
            document.getElementById('lblResSub').innerText = 'Tổng Gốc + Lãi:';
            document.getElementById('resRate').innerText = (annualRate * 100).toFixed(1) + '% / năm';

            const totalInterest = principal * annualRate * (termMonths / 12);
            document.getElementById('resInterest').innerText = formatMoney(totalInterest);
            document.getElementById('resTotal').innerText = formatMoney(principal + totalInterest);
        } else {
            // Tính Vay (dư nợ giảm dần)
            scheduleSection.style.display = 'block';
            document.getElementById('lblResMain').innerText = 'Tổng Lãi Phải Trả:';
            document.getElementById('lblResSub').innerText = 'Tổng Gốc + Lãi Phải Trả:';
            document.getElementById('resRate').innerText = (annualRate * 100).toFixed(1) + '% / năm';

            let monthlyPrincipal = principal / termMonths;
            let remainingPrincipal = principal;
            let totalInterest = 0;
            let html = '';

            scheduleBody.innerHTML = '';
            for (let i = 1; i <= termMonths; i++) {
                let monthlyInterest = remainingPrincipal * (annualRate / 12);
                let totalMonthly = monthlyPrincipal + monthlyInterest;
                totalInterest += monthlyInterest;

                html += `<tr>
                    <td>Tháng ${i}</td>
                    <td>${formatMoney(monthlyPrincipal)}</td>
                    <td>${formatMoney(monthlyInterest)}</td>
                    <td><b>${formatMoney(totalMonthly)}</b></td>
                </tr>`;
                remainingPrincipal -= monthlyPrincipal;
            }
            scheduleBody.innerHTML = html;
            document.getElementById('resInterest').innerText = formatMoney(totalInterest);
            document.getElementById('resTotal').innerText = formatMoney(principal + totalInterest);
        }
    }

    // Khởi chạy
    renderBanks();
    updateRate();
    calculate();
</script>

</body>
</html>
